alias: PV Control - Battery Settings
description: >-
  Battery charging on/off (binary_sensor.pv_control_battery_charging_enabled): 30 A / 0 A charge
  current. This register is stored in EEPROM, so it only changes with that switch; the charge power
  of a grid charge (incl. the 15-min import cap) comes with sensor.pv_control_inverter_command
  (RAM, script.pv_control_apply_mode).
triggers:
  - trigger: state
    entity_id:
      - binary_sensor.pv_control_battery_charging_enabled
    to: "off"
    id: BATT_DISABLE
  - trigger: state
    entity_id:
      - binary_sensor.pv_control_battery_charging_enabled
    to: "on"
    id: BATT_ENABLE
conditions: []
variables:
  charge_current: "{{ 30 if trigger.id == 'BATT_ENABLE' else 0 }}"
actions:
  - if:
      - condition: template
        value_template: >-
          {{ (states('number.solax_battery_charge_max_current') | float(-1) - charge_current) | abs >= 0.1 }}
    then:
      - action: number.set_value
        metadata: {}
        data:
          value: "{{ charge_current }}"
        target:
          entity_id: number.solax_battery_charge_max_current
mode: queued
