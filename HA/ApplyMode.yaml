# script.pv_control_apply_mode – the only place that writes the inverter for PV Control's modes.
# SolaX VPP mode 8 ("Individual Setting – Duration Mode", registers 0xA0–0xA7) through the
# integration's *_direct entities: the numbers are only stored locally, selecting the mode on
# select.solax_remote_control_power_control_mode_direct writes the whole block in one go (RAM, no
# EEPROM). "Disabled" ends VPP (0x7C block zeros); the base work mode stays Self Use.
# Another inverter = another version of this script; PV Control and the reconciler stay the same.
alias: PV Control - Apply Mode
description: Applies sensor.pv_control_inverter_command to the inverter (SolaX VPP mode 8, RAM) and records the applied seq.
mode: queued
max: 5
fields:
  mode:
    description: PV Control mode (normal, force_charge, force_charge_grid_only, grid_only, force_discharge, feedin_priority, reset)
  power_w:
    description: Battery power, W (+ charge, − discharge)
  seq:
    description: Version of the command
sequence:
  - variables:
      vpp: "{{ mode in ['force_charge', 'force_charge_grid_only', 'grid_only', 'force_discharge'] }}"
      # SolaX push power: positive discharges, negative charges.
      push_w: "{{ -(power_w | int(0)) }}"
      pv_limit_w: "{{ 0 if mode == 'force_charge_grid_only' else 30000 }}"
      # Run time of one command: the reconciler refreshes it while PV Control runs; if HA or PV Control
      # stops, the inverter returns to its base work mode by itself within this time.
      duration_s: 1200
  # VPP doesn't start from Manual Mode (SolaX): leave it once (a single EEPROM write, only after the old scheme).
  - if:
      - condition: state
        entity_id: select.solax_charger_use_mode
        state: Manual Mode
    then:
      - action: select.select_option
        target:
          entity_id: select.solax_charger_use_mode
        data:
          option: Self Use Mode
      - delay:
          seconds: 5
  - if:
      - condition: template
        value_template: "{{ vpp }}"
    then:
      - action: number.set_value
        target:
          entity_id: number.solax_remotecontrol_pv_power_limit_direct
        data:
          value: "{{ pv_limit_w }}"
      - action: number.set_value
        target:
          entity_id: number.solax_remotecontrol_push_mode_power_8_9_direct
        data:
          value: "{{ push_w }}"
      - action: number.set_value
        target:
          entity_id: number.solax_remotecontrol_duration_8_direct_2
        data:
          value: "{{ duration_s }}"
      # Register 0xA7 depends on the VPP mode (SolaX "VPP function Definition of ESS"): WaitTimeout in
      # modes 1/2, NextMotion in mode 8, ExecDuration in mode 9 — the integration labels it "timeout"
      # for 8/9. Mode 8: 0xA0 = 160 = after the run time exit VPP to the base work mode. Read as a
      # WaitTimeout it would be harmless too (160 s waiting, then exit VPP). To be confirmed in the first
      # test with sensor.solax_remotecontrol_mode8_next_motion_readback (disabled by default).
      - action: number.set_value
        target:
          entity_id: number.solax_remotecontrol_timeout_8_9_direct
        data:
          value: 160
      - action: select.select_option
        target:
          entity_id: select.solax_power_control_mode_target_set_type_direct
        data:
          option: Set
      - action: select.select_option
        target:
          entity_id: select.solax_remote_control_power_control_mode_direct
        data:
          option: Individual Setting - Duration Mode
    else:
      - action: select.select_option
        target:
          entity_id: select.solax_remote_control_power_control_mode_direct
        data:
          option: Disabled
  - action: input_number.set_value
    target:
      entity_id: input_number.pv_control_applied_seq
    data:
      value: "{{ seq | int(0) }}"
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.pv_control_applied_at
    data:
      timestamp: "{{ now().timestamp() }}"
