type: custom:plotly-graph
title: Predicted SoC vs True SoC
hours_to_show: 24
refresh_interval: 60

entities:
  # ── SoC bars, colored per mode (single trace, marker.color array) ───────
  # Each 15-min slot becomes one bar colored by its inverter mode.
  # width: 900000 = 15 min in milliseconds (plotly datetime bar width unit).
  - entity: sensor.pv_control_info_predicted_soc
    name: SoC (mode)
    fetch_mask: 0
    fn: >
      ({ entity }) => {
        const d = entity?.attributes?.data_actual || [];
        const c = {
          past:                    'rgba(140,140,140,0.35)',
          normal:                  'rgba(50,150,255,0.50)',
          feedin_priority:         'rgba(50,210,80,0.60)',
          force_charge:            'rgba(255,100,50,0.65)',
          opportunistic_discharge: 'rgba(255,200,0,0.65)',
        };
        return {
          x: d.map(s => new Date(s.datetime)),
          y: d.map(s => s.soc),
          marker: { color: d.map(s => c[s.mode] || 'gray') },
          width: 900000,
        };
      }
    type: bar
    showlegend: false

  # ── Dummy legend entries (invisible scatter points) ──────────────────────
  - entity: sensor.pv_control_info_predicted_soc
    name: Past
    fetch_mask: 0
    fn: "() => ({ x: [], y: [] })"
    type: scatter
    mode: markers
    marker:
      color: rgba(140,140,140,0.80)
      size: 10
      symbol: square

  - entity: sensor.pv_control_info_predicted_soc
    name: Normal
    fetch_mask: 0
    fn: "() => ({ x: [], y: [] })"
    type: scatter
    mode: markers
    marker:
      color: rgba(50,150,255,0.80)
      size: 10
      symbol: square

  - entity: sensor.pv_control_info_predicted_soc
    name: Feed-in Priority
    fetch_mask: 0
    fn: "() => ({ x: [], y: [] })"
    type: scatter
    mode: markers
    marker:
      color: rgba(50,210,80,0.80)
      size: 10
      symbol: square

  - entity: sensor.pv_control_info_predicted_soc
    name: Force Charge
    fetch_mask: 0
    fn: "() => ({ x: [], y: [] })"
    type: scatter
    mode: markers
    marker:
      color: rgba(255,100,50,0.80)
      size: 10
      symbol: square

  - entity: sensor.pv_control_info_predicted_soc
    name: Opportunistic Discharge
    fetch_mask: 0
    fn: "() => ({ x: [], y: [] })"
    type: scatter
    mode: markers
    marker:
      color: rgba(255,200,0,0.80)
      size: 10
      symbol: square

  # ── Live prediction line: red = normal, green = extra load active ────────
  - entity: sensor.pv_control_info_predicted_soc
    name: Live prediction
    fetch_mask: 0
    fn: "({ entity }) => { const d = entity?.attributes?.data_actual || []; return { x: d.map(s => new Date(s.datetime)), y: d.map(s => s.mode !== 'past' && !s.extra_load ? s.soc : null) }; }"
    type: scatter
    mode: lines
    connectgaps: false
    line:
      color: rgba(255,80,80,0.95)
      width: 2

  - entity: sensor.pv_control_info_predicted_soc
    name: Live prediction (extra load)
    fetch_mask: 0
    fn: "({ entity }) => { const d = entity?.attributes?.data_actual || []; return { x: d.map(s => new Date(s.datetime)), y: d.map(s => s.mode !== 'past' && s.extra_load ? s.soc : null) }; }"
    type: scatter
    mode: lines
    connectgaps: false
    line:
      color: rgba(0,230,80,0.95)
      width: 2

  # ── True SoC (history-based, 24 h) ──────────────────────────────────────
  - entity: sensor.solax_battery_capacity
    name: True SoC
    type: scatter
    mode: lines+markers
    line:
      color: cyan
      width: 2
    marker:
      color: cyan
      size: 3

  # ── Brutto import price ───────────────────────────────────────────────────
  - entity: sensor.pv_control_current_import_price_brutto
    name: Import Price
    fetch_mask: 0
    fn: "({ entity }) => { const d = entity?.attributes?.data || []; return { x: d.map(s => new Date(s.start_time)), y: d.map(s => s.price_per_kwh) }; }"
    yaxis: y2
    type: bar
    marker:
      color: rgba(255,255,255,0.15)

layout:
  xaxis:
    autorange: true
  yaxis:
    title: SoC (%)
    range:
      - 0
      - 105
    fixedrange: false
  yaxis2:
    title: Price (€/kWh)
    overlaying: "y"
    side: right
    range:
      - 0
      - 0.50
    showgrid: false
    tickformat: ".2f"
  legend:
    orientation: h
    y: -0.15
  barmode: overlay
  margin:
    t: 30
    b: 70
