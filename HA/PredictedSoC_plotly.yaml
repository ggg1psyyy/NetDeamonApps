type: custom:plotly-graph
title: Predicted SoC vs True SoC
hours_to_show: 24
refresh_interval: 60

entities:
  # ── Mode-colored filled areas ───────────────────────────────────────────
  # Each trace shows SoC only for its mode's slots, filled to zero.
  # Inline fn: strings used (avoids YAML multiline folding issues).

  - entity: sensor.pv_control_info_predicted_soc
    name: Past
    x: "fn:({ hass }) => { const d = hass.states['sensor.pv_control_info_predicted_soc']?.attributes?.data_actual || []; return d.filter(s => s.mode === 'past').map(s => new Date(s.datetime)); }"
    y: "fn:({ hass }) => { const d = hass.states['sensor.pv_control_info_predicted_soc']?.attributes?.data_actual || []; return d.filter(s => s.mode === 'past').map(s => s.soc); }"
    type: scatter
    mode: none
    fill: tozeroy
    fillcolor: rgba(140,140,140,0.25)
    line:
      width: 0

  - entity: sensor.pv_control_info_predicted_soc
    name: Normal
    x: "fn:({ hass }) => { const d = hass.states['sensor.pv_control_info_predicted_soc']?.attributes?.data_actual || []; return d.filter(s => s.mode === 'normal').map(s => new Date(s.datetime)); }"
    y: "fn:({ hass }) => { const d = hass.states['sensor.pv_control_info_predicted_soc']?.attributes?.data_actual || []; return d.filter(s => s.mode === 'normal').map(s => s.soc); }"
    type: scatter
    mode: none
    fill: tozeroy
    fillcolor: rgba(50,150,255,0.30)
    line:
      width: 0

  - entity: sensor.pv_control_info_predicted_soc
    name: Feed-in Priority
    x: "fn:({ hass }) => { const d = hass.states['sensor.pv_control_info_predicted_soc']?.attributes?.data_actual || []; return d.filter(s => s.mode === 'feedin_priority').map(s => new Date(s.datetime)); }"
    y: "fn:({ hass }) => { const d = hass.states['sensor.pv_control_info_predicted_soc']?.attributes?.data_actual || []; return d.filter(s => s.mode === 'feedin_priority').map(s => s.soc); }"
    type: scatter
    mode: none
    fill: tozeroy
    fillcolor: rgba(50,210,80,0.35)
    line:
      width: 0

  - entity: sensor.pv_control_info_predicted_soc
    name: Force Charge
    x: "fn:({ hass }) => { const d = hass.states['sensor.pv_control_info_predicted_soc']?.attributes?.data_actual || []; return d.filter(s => s.mode === 'force_charge').map(s => new Date(s.datetime)); }"
    y: "fn:({ hass }) => { const d = hass.states['sensor.pv_control_info_predicted_soc']?.attributes?.data_actual || []; return d.filter(s => s.mode === 'force_charge').map(s => s.soc); }"
    type: scatter
    mode: none
    fill: tozeroy
    fillcolor: rgba(255,100,50,0.40)
    line:
      width: 0

  - entity: sensor.pv_control_info_predicted_soc
    name: Opportunistic Discharge
    x: "fn:({ hass }) => { const d = hass.states['sensor.pv_control_info_predicted_soc']?.attributes?.data_actual || []; return d.filter(s => s.mode === 'opportunistic_discharge').map(s => new Date(s.datetime)); }"
    y: "fn:({ hass }) => { const d = hass.states['sensor.pv_control_info_predicted_soc']?.attributes?.data_actual || []; return d.filter(s => s.mode === 'opportunistic_discharge').map(s => s.soc); }"
    type: scatter
    mode: none
    fill: tozeroy
    fillcolor: rgba(255,200,0,0.40)
    line:
      width: 0

  # ── Live prediction line: red = no extra load, green = extra load active ─
  - entity: sensor.pv_control_info_predicted_soc
    name: Live prediction
    x: "fn:({ hass }) => { const d = hass.states['sensor.pv_control_info_predicted_soc']?.attributes?.data_actual || []; return d.filter(s => s.mode !== 'past' && !s.extra_load).map(s => new Date(s.datetime)); }"
    y: "fn:({ hass }) => { const d = hass.states['sensor.pv_control_info_predicted_soc']?.attributes?.data_actual || []; return d.filter(s => s.mode !== 'past' && !s.extra_load).map(s => s.soc); }"
    type: scatter
    mode: lines
    line:
      color: rgba(255,80,80,0.95)
      width: 2

  - entity: sensor.pv_control_info_predicted_soc
    name: Live prediction (extra load)
    x: "fn:({ hass }) => { const d = hass.states['sensor.pv_control_info_predicted_soc']?.attributes?.data_actual || []; return d.filter(s => s.mode !== 'past' && s.extra_load).map(s => new Date(s.datetime)); }"
    y: "fn:({ hass }) => { const d = hass.states['sensor.pv_control_info_predicted_soc']?.attributes?.data_actual || []; return d.filter(s => s.mode !== 'past' && s.extra_load).map(s => s.soc); }"
    type: scatter
    mode: lines
    line:
      color: rgba(0,230,80,0.95)
      width: 2

  # ── True SoC (history-based, 24 h) ──────────────────────────────────────
  - entity: sensor.solax_battery_capacity
    name: True SoC
    type: scatter
    mode: lines+markers
    line:
      color: cyan
      width: 2
    marker:
      color: cyan
      size: 3

  # ── Electricity price (EPEX netto → €/kWh) ──────────────────────────────
  - entity: sensor.epex_spot_data_market_price_3
    name: Electricity Price (netto)
    yaxis: y2
    x: "fn:({ hass }) => { const d = hass.states['sensor.epex_spot_data_market_price_3']?.attributes?.data || []; return d.map(s => new Date(s.start_time)); }"
    y: "fn:({ hass }) => { const d = hass.states['sensor.epex_spot_data_market_price_3']?.attributes?.data || []; return d.map(s => s.price_ct_per_kwh / 100); }"
    type: bar
    marker:
      color: rgba(255,255,255,0.20)

layout:
  xaxis:
    # autorange lets plotly fit the window to all traces, including future prediction data.
    # hours_to_show above still controls how much True SoC history is fetched from HA.
    autorange: true
  yaxis:
    title: SoC (%)
    range:
      - 0
      - 105
    fixedrange: false
  yaxis2:
    title: Price (€/kWh)
    overlaying: "y"
    side: right
    range:
      - 0
      - 0.50
    showgrid: false
    tickformat: ".2f"
  legend:
    orientation: h
    y: -0.15
  margin:
    t: 30
    b: 70
