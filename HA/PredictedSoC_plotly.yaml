type: custom:plotly-graph
title: Predicted SoC vs True SoC
hours_to_show: 24
refresh_interval: 60

entities:
  # ── Mode-colored filled areas ───────────────────────────────────────────
  # fn: at entity level returns {x, y} which overrides the history-based data.
  # fetch_mask: 0 prevents unnecessary history fetching for attribute-based traces.

  - entity: sensor.pv_control_info_predicted_soc
    name: Past
    fetch_mask: 0
    fn: "({ entity }) => { const d = (entity?.attributes?.data_actual || []).filter(s => s.mode === 'past'); return { x: d.map(s => new Date(s.datetime)), y: d.map(s => s.soc) }; }"
    type: scatter
    mode: none
    fill: tozeroy
    fillcolor: rgba(140,140,140,0.25)
    line:
      width: 0

  - entity: sensor.pv_control_info_predicted_soc
    name: Normal
    fetch_mask: 0
    fn: "({ entity }) => { const d = (entity?.attributes?.data_actual || []).filter(s => s.mode === 'normal'); return { x: d.map(s => new Date(s.datetime)), y: d.map(s => s.soc) }; }"
    type: scatter
    mode: none
    fill: tozeroy
    fillcolor: rgba(50,150,255,0.30)
    line:
      width: 0

  - entity: sensor.pv_control_info_predicted_soc
    name: Feed-in Priority
    fetch_mask: 0
    fn: "({ entity }) => { const d = (entity?.attributes?.data_actual || []).filter(s => s.mode === 'feedin_priority'); return { x: d.map(s => new Date(s.datetime)), y: d.map(s => s.soc) }; }"
    type: scatter
    mode: none
    fill: tozeroy
    fillcolor: rgba(50,210,80,0.35)
    line:
      width: 0

  - entity: sensor.pv_control_info_predicted_soc
    name: Force Charge
    fetch_mask: 0
    fn: "({ entity }) => { const d = (entity?.attributes?.data_actual || []).filter(s => s.mode === 'force_charge'); return { x: d.map(s => new Date(s.datetime)), y: d.map(s => s.soc) }; }"
    type: scatter
    mode: none
    fill: tozeroy
    fillcolor: rgba(255,100,50,0.40)
    line:
      width: 0

  - entity: sensor.pv_control_info_predicted_soc
    name: Opportunistic Discharge
    fetch_mask: 0
    fn: "({ entity }) => { const d = (entity?.attributes?.data_actual || []).filter(s => s.mode === 'opportunistic_discharge'); return { x: d.map(s => new Date(s.datetime)), y: d.map(s => s.soc) }; }"
    type: scatter
    mode: none
    fill: tozeroy
    fillcolor: rgba(255,200,0,0.40)
    line:
      width: 0

  # ── Live prediction line: red = no extra load, green = extra load active ─
  - entity: sensor.pv_control_info_predicted_soc
    name: Live prediction
    fetch_mask: 0
    fn: "({ entity }) => { const d = (entity?.attributes?.data_actual || []).filter(s => s.mode !== 'past' && !s.extra_load); return { x: d.map(s => new Date(s.datetime)), y: d.map(s => s.soc) }; }"
    type: scatter
    mode: lines
    line:
      color: rgba(255,80,80,0.95)
      width: 2

  - entity: sensor.pv_control_info_predicted_soc
    name: Live prediction (extra load)
    fetch_mask: 0
    fn: "({ entity }) => { const d = (entity?.attributes?.data_actual || []).filter(s => s.mode !== 'past' && s.extra_load); return { x: d.map(s => new Date(s.datetime)), y: d.map(s => s.soc) }; }"
    type: scatter
    mode: lines
    line:
      color: rgba(0,230,80,0.95)
      width: 2

  # ── True SoC (history-based, 24 h) ──────────────────────────────────────
  - entity: sensor.solax_battery_capacity
    name: True SoC
    type: scatter
    mode: lines+markers
    line:
      color: cyan
      width: 2
    marker:
      color: cyan
      size: 3

  # ── Brutto import price (data attribute: {start_time, price_per_kwh}) ───
  - entity: sensor.pv_control_current_import_price_brutto
    name: Import Price
    fetch_mask: 0
    fn: "({ entity }) => { const d = entity?.attributes?.data || []; return { x: d.map(s => new Date(s.start_time)), y: d.map(s => s.price_per_kwh) }; }"
    yaxis: y2
    type: bar
    marker:
      color: rgba(255,255,255,0.20)

layout:
  xaxis:
    autorange: true
  yaxis:
    title: SoC (%)
    range:
      - 0
      - 105
    fixedrange: false
  yaxis2:
    title: Price (€/kWh)
    overlaying: "y"
    side: right
    range:
      - 0
      - 0.50
    showgrid: false
    tickformat: ".2f"
  legend:
    orientation: h
    y: -0.15
  margin:
    t: 30
    b: 70
