type: custom:plotly-graph
title: Predicted SoC
refresh_interval: 60

entities:
  # ── Past: solid line ──────────────────────────────────────────────────────
  - entity: sensor.pv_control_info_predicted_soc
    name: Predicted SoC
    filters:
      - fn: |-
          ({ meta }) => {
            const now = new Date();
            const d = meta.data_actual.filter(s => new Date(s.datetime) <= now);
            return {
              xs: d.map(({ datetime }) => new Date(datetime)),
              ys: d.map(({ soc }) => soc),
            };
          }
    type: scatter
    mode: lines
    line:
      color: lightblue
      width: 2
      shape: spline

  # ── Future: dotted line ───────────────────────────────────────────────────
  - entity: sensor.pv_control_info_predicted_soc
    name: Predicted SoC (future)
    showlegend: false
    filters:
      - fn: |-
          ({ meta }) => {
            const now = new Date();
            const d = meta.data_actual.filter(s => new Date(s.datetime) >= now);
            return {
              xs: d.map(({ datetime }) => new Date(datetime)),
              ys: d.map(({ soc }) => soc),
            };
          }
    type: scatter
    mode: lines
    line:
      color: cyan
      width: 2
      shape: spline
      dash: dot

  # ── Import price (y2) ─────────────────────────────────────────────────────
  - entity: sensor.pv_control_current_import_price_brutto
    name: Import Price
    yaxis: y2
    filters:
      - fn: |-
          ({ meta }) => ({
            xs: meta.data.map(({ start_time }) => new Date(start_time)),
            ys: meta.data.map(({ price_per_kwh }) => price_per_kwh),
          })
    type: scatter
    mode: lines
    line:
      color: grey
      width: 1

layout:
  xaxis:
    autorange: true
  yaxis:
    title: SoC (%)
    range: [0, 105]
    autorange: false
  yaxis2:
    title: Price (€/kWh)
    overlaying: "y"
    side: right
    range: [0, 0.55]
    showgrid: false
    tickformat: ".2f"
