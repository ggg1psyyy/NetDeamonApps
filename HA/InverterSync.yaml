# PV Control - Inverter Sync: keeps the inverter in sensor.pv_control_inverter_command.
#   desired  – the command (mode, battery_power_w, seq), PV Control is the only decider
#   applied  – input_number.pv_control_applied_seq (script.pv_control_apply_mode)
#   actual   – sensor.solax_modbus_power_control
# Applies when PV Control published a new version, when the inverter left the commanded state, and
# refreshes the mode-8 run time before it ends. Not while PV Control is down (its last cycle older
# than 2 min): then the run time lapses and the inverter returns to its base work mode by itself.
# More than 5 re-applies of the same version: stop, flag, notify (PV Control health → error).
alias: PV Control - Inverter Sync
description: Applies PV Control's inverter command and keeps the inverter in it (SolaX VPP mode 8, RAM).
mode: queued
max: 3
triggers:
  - trigger: state
    entity_id: sensor.pv_control_inverter_command
    attribute: seq
    for:
      seconds: 5
    id: COMMAND
  - trigger: state
    entity_id: sensor.solax_modbus_power_control
    id: INVERTER
  - trigger: time_pattern
    minutes: /1
    id: TICK
conditions:
  - condition: template
    value_template: >-
      {% set lc = state_attr('sensor.pv_control_health', 'last_cycle') %}
      {{ lc is not none and now() - as_datetime(lc) < timedelta(minutes=2) }}
  - condition: template
    value_template: "{{ states('sensor.pv_control_inverter_command') not in ['unknown', 'unavailable'] }}"
variables:
  mode: "{{ states('sensor.pv_control_inverter_command') }}"
  seq: "{{ state_attr('sensor.pv_control_inverter_command', 'seq') | int(0) }}"
  power_w: "{{ state_attr('sensor.pv_control_inverter_command', 'battery_power_w') | int(0) }}"
  applied_seq: "{{ states('input_number.pv_control_applied_seq') | int(-1) }}"
  vpp: "{{ mode in ['force_charge', 'force_charge_grid_only', 'grid_only', 'force_discharge'] }}"
  actual: "{{ states('sensor.solax_modbus_power_control') }}"
  actual_ok: "{{ (vpp and actual == 'Individual Setting - Duration Mode') or (not vpp and actual == 'Disabled') }}"
  applied_age_s: >-
    {% set at = states('input_datetime.pv_control_applied_at') %}
    {{ (now() - as_datetime(at) | as_local).total_seconds() | int if at not in ['unknown', 'unavailable', ''] else 999999 }}
  new_version: "{{ seq != applied_seq }}"
  fell_back: "{{ not new_version and not actual_ok }}"
  # Mode 8 runs 1200 s; refresh after 600 s.
  refresh_due: "{{ not new_version and vpp and actual_ok and applied_age_s > 600 }}"
actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ new_version }}"
        sequence:
          - action: input_number.set_value
            target:
              entity_id: input_number.pv_control_reapply_count
            data:
              value: 0
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.pv_control_inverter_sync_blocked
          - action: script.pv_control_apply_mode
            data:
              mode: "{{ mode }}"
              power_w: "{{ power_w }}"
              seq: "{{ seq }}"
      - conditions:
          - condition: template
            value_template: "{{ fell_back }}"
          - condition: state
            entity_id: input_boolean.pv_control_inverter_sync_blocked
            state: "off"
        sequence:
          - if:
              - condition: numeric_state
                entity_id: input_number.pv_control_reapply_count
                above: 4
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.pv_control_inverter_sync_blocked
              - action: ntfy.publish
                target:
                  entity_id: notify.ha_warnings
                data:
                  title: PV Control - inverter not following
                  message: >-
                    Command {{ mode }} ({{ power_w }} W, seq {{ seq }}) re-applied 5 times, the inverter
                    reports '{{ actual }}'. Stopped retrying until PV Control issues a new command.
            else:
              - action: input_number.increment
                target:
                  entity_id: input_number.pv_control_reapply_count
              - action: script.pv_control_apply_mode
                data:
                  mode: "{{ mode }}"
                  power_w: "{{ power_w }}"
                  seq: "{{ seq }}"
      - conditions:
          - condition: template
            value_template: "{{ refresh_due }}"
        sequence:
          - action: script.pv_control_apply_mode
            data:
              mode: "{{ mode }}"
              power_w: "{{ power_w }}"
              seq: "{{ seq }}"
