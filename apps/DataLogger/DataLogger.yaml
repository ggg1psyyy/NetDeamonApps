PVControl.DataLoggerConfig:
  DBLocation: "apps/DataLogger/energy_history.db"
  TemperatureOutsideEntity: sensor.temperature_outside
  TemperatureInsideEntity: sensor.temperatur_wohnen
  AtmoPressureEntity: sensor.pirateweather_pressure
  TemperatureWarmwaterEntity: sensor.wp_warmwasser_temperatur
  CloudCoverEntity: sensor.pirateweather_cloud_coverage
  HumidityEntity: sensor.pirateweather_humidity
  BatterySoCEntity: sensor.solax_battery_capacity
  PVYieldEntity: sensor.solax_today_s_solar_energy
  # Priority-ordered fallback list — same epex_spot source family PVControl.yaml uses,
  # since one or another provider variant occasionally stops reporting for hours/days.
  PriceEnergyImportEntities:
    - sensor.epex_spot_data_market_price
    - sensor.epex_spot_data_market_price_2
    - sensor.epex_spot_data_market_price_4
    - sensor.epex_spot_data_market_price_3
  # How to determine which entity's value to log as priceenergyexport, checked in order:
  #   1. PriceEnergyExportSameAsImport: true -> reuse the resolved import price entity
  #   2. PriceEnergyExportFixed: true        -> PriceEnergyExportFixedEntity or PriceEnergyExportFixedValue
  #   3. otherwise                           -> first available entity in PriceEnergyExportEntities
  PriceEnergyExportSameAsImport: false
  PriceEnergyExportFixed: false
  # PriceEnergyExportFixedEntity: sensor.some_fixed_feedin_tariff
  # PriceEnergyExportFixedValue: 0.05
  # PVControl's own feed-in price (€/kWh). Until 2026-06 this column held the OeMAG monthly
  # market price in ct/kWh (sensor.oemag_marktpreis, no longer available in HA).
  PriceEnergyExportEntities:
    - sensor.pv_control_current_export_price_brutto
  HouseEnergyEntity: sensor.house_energy_consumption_day
  ImportEnergyEntity: sensor.solax_today_s_import_energy
  ExportEnergyEntity: sensor.solax_today_s_export_energy
  BatteryChargeEntity: sensor.solax_battery_input_energy_today
  BatteryDischargeEntity: sensor.solax_battery_output_energy_today
  CarChargeEntity: sensor.esp_ct8_daily_energy_carport
  CarSoCEntity: sensor.byd_atto_2_ladezustand
  # CarDischargeEntity: 
  # Never-resetting total (since 2026-10-21). sensor.wp_daily_energy_total sums two ESP daily
  # counters that reset a moment apart at midnight — counted as a reset plus 2.98 kWh on 2026-10-20.
  HeatPumpEnergyEntity: sensor.wp_energy_lifetime_total
  WarmwaterEnergyEntity: sensor.ww_energy_consumption_day
  # Heat pump operation and the house's state (since 2026-10-22) for the load and heating models:
  # mode, minutes heating/compressor/eco, flow/return, wind, presence, room valves and setpoints.
  HeatPumpModeEntity: select.warmepumpe_modus
  HeatingActiveEntity: binary_sensor.wp_heizung_aktiv
  CompressorActiveEntity: binary_sensor.wp_verdichter_1_stufe_aktiv
  EcoModeEntity: binary_sensor.wp_sparbetrieb_aktiv
  # What eco mode (Sparbetrieb) actually changes: the heat pump's current target temperature.
  TargetTemperatureEntity: sensor.wp_aktuelle_solltemperatur
  FlowTemperatureEntity: sensor.wp_vorlauftemperatur_sekundar
  ReturnTemperatureEntity: sensor.wp_rucklauftemperatur_sekundar
  WindSpeedEntity: sensor.wind_geschwindigkeit
  PresenceEntity: person.gipsy
  # Heated living rooms (the cellar is on standby and only logged by HeatingTest).
  # Heat pump heat output and its electricity per mode (since 2026-10-24, HA templates: heat =
  # electrical power × COP while the mode's flag is on; never-resetting totals) — COP per mode.
  # Grid import counters (kWh) in priority order, for the highest 15-min import per hour/day (v8)
  ImportTotalEntities:
    - sensor.esp_wmbus_0x290340_stromzahler_bezug   # utility meter via wM-Bus (billing meter)
    - sensor.solax_grid_import_total                # inverter
  # PVControl's mode and the inverter's EEPROM writes (v9): every state change of these settings
  # is a write to the inverter's non-volatile memory.
  PVControlModeEntity: sensor.pv_control_mode
  BatteryChargingEnabledEntity: binary_sensor.pv_control_battery_charging_enabled
  InverterEepromEntities:
    - select.solax_charger_use_mode
    - select.solax_manual_mode_select
    - number.solax_battery_charge_max_current
    - number.solax_export_control_user_limit
  HeatEnergyHeatingEntity: sensor.wp_heat_energy_heating
  HeatEnergyWarmwaterEntity: sensor.wp_heat_energy_warmwater
  ElecEnergyHeatingEntity: sensor.wp_cop_elec_energy_heating
  ElecEnergyWarmwaterEntity: sensor.wp_cop_elec_energy_warmwater
  RoomClimateEntities:
    - climate.wohnen_kuche
    - climate.bad
    - climate.arbeit_gang
    - climate.gast
    - climate.schlafen