# Sample of PVControl.yaml — copy it to PVControl.yaml (not in git: the real config stays local and on HA, deploy.py copies it)
# and adapt it. A new or renamed key goes into both files.
NetDeamon.apps.PVControl.PVConfig:
  # config entries marked with '***' are required

  # Market Price entities of the epex_spot integration (the raw EPEX price, list in the `data` attribute;
  # markup, network fee and tax are added below — the integration's surcharge/tax stay 0)
  # *** ha_epex_spot https://github.com/mampfes/ha_epex_spot
  # Several sources (they fail sometimes, and publish tomorrow at different times): all are equal,
  # the one whose data reaches furthest is used — whichever publishes tomorrow first wins; on a tie
  # the earlier one in the list. ImportPriceResolution below applies to every source.
  CurrentImportPriceEntities:
    - sensor.extern_epex_spot_data_market_price     # Energy-Charts, 15 min
    - sensor.extern_epex_spot_data_market_price_2   # ENTSO-E Transparency, 15 min
  ImportPriceMultiplier: 1.0
  ImportPriceAddition: 0.015833   # Hofer Grünstrom Spot: 1.583 ct/kWh netto on the market price
  ImportPriceNetwork: 0.07992
  ImportPriceNetworkPeriods:
    # SNAP (Sommer-Nieder-Arbeitspreis): 20% discount on network fee, Apr–Sep 10:00–16:00
    # StartYear/EndYear bound the months: from StartMonth of StartYear to EndMonth of EndYear
    # (0 or missing = no limit). End a tariff by hand when it goes.
    - Name: SNAP (Sommer-Nieder-Arbeitspreis)
      StartMonth: 4
      EndMonth: 9
      StartHour: 10
      EndHour: 16
      StartYear: 2026
      EndYear: 2099
      Price: 0.06882
    # WiNAP (Winter-Nieder-Arbeitspreis): Oct 1 - Mar 31, 23:00-05:00, first from 1 Oct 2027
    # (SNE-G-V, BGBl. II 299/2026, § 7 Abs. 4 and § 32 Abs. 4). Its price comes with the
    # tariff ordinance (SNE-T-V); until then the SNAP rate as a placeholder.
    # Month/hour ranges both wrap across their boundary (Oct→Mar, 23:00→05:00) — see
    # NetworkPricePeriod.IsActiveAt in PVControlCommon.cs.
    - Name: WiNAP (Winter-Nieder-Arbeitspreis)
      StartMonth: 10
      EndMonth: 3
      StartHour: 23
      EndHour: 5
      StartYear: 2027
      EndYear: 2099
      Price: 0.06882
  ImportPriceTax: 0.2
  # Import tariff, the default: only used when select.pv_control_import_tariff is created; afterwards the select keeps
  # the choice (a restart with a different select only logs the difference):
  #   Market = the market price × ImportPriceMultiplier + ImportPriceAddition
  #   Fixed  = the fixed energy price below (netto: without tax and network fee, €/kWh); the network fee (incl. its
  #            periods) and the tax stay. No market price needed (the export price with ExportTariffDefault
  #            SameAsImport still is the market's).
  ImportTariffDefault: Market
  # Time of day a tariff chosen in HA takes effect (import and export): until then the plan prices the quarters
  # before it with the tariff in force, those from it with the chosen one.
  TariffSwitchTime: "00:00"
  # ImportPriceFixedEntity: input_number.fixed_energy_price
  # The fixed tariff's energy price (Hofer Grünstrom Fair, netto): priced for the tariff advisor and a switch to Fixed
  ImportPriceFixedValue: 0.14125   # 14.125 ct/kWh netto; ImportPriceTax (VAT) and the network fee are added to it
  # How the raw price data is interpreted:
  #   QuarterHourly = use each 15-min price as-is
  #   Hourly        = average the four 15-min prices within each hour and apply that
  #                    mean to all four slots (use this if your provider bills the
  #                    hourly EPEX average rather than the raw 1/4h price)
  ImportPriceResolution: QuarterHourly   # Hofer Spot bills the 15-min price
  # Tomorrow's prices arrive ~13:00; until then the simulation estimates them from the same hour a
  # day earlier. Risk premium on those estimates: import × 1.05, export × 0.95 — an estimated slot
  # only wins over a published one when it's clearly better.
  EstimatedPricePremium: 0.05
  # Both planners (greedy and DP) plan with the house load forecast raised by the 80th percentile of the night forecast's
  # error over the scored nights (sensor.pv_control_load_forecast, 0–30 %) — a reserve for a load above the forecast.
  # This value (%) until 7 nights are scored.
  LoadMarginPct: 15
  # Export (feed-in) tariff, the default (as ImportTariffDefault, select.pv_control_export_tariff):
  #   SameAsImport = the import market price, scaled with the export settings below
  #   Fixed        = a fixed feed-in price as paid (ExportPriceFixedEntity takes priority over ExportPriceFixedValue)
  #   Market       = its own market price, CurrentExportPriceEntities (fallback list, like import), scaled below
  ExportTariffDefault: SameAsImport
  # Hofer Grünstrom Sonne: the Referenzmarktwert PV less a deduction. Source: the running month's estimate, low end
  # (HACS integration ha-referenzmarktwert); ExportPriceFixedValue only while the entity is unavailable (Nov 2026).
  # ExportPriceFixedAddition is added to either (negative = deduction, €/kWh).
  ExportPriceFixedEntity: sensor.extern_referenzmarktwert_pv_estimate_running_month_low
  ExportPriceFixedValue: 0.234
  ExportPriceFixedAddition: -0.019
  # CurrentExportPriceEntities:
  #   - sensor.epex_spot_data_price_2
  ExportPriceMultiplier: 0.8
  ExportPriceAddition: 0.0
  ExportPriceNetwork: 0.0
  ExportPriceTax: 0.0
  # Same as ImportPriceResolution, but for the export price (ExportTariff SameAsImport or Market) — a fixed
  # feed-in price has no resolution.
  ExportPriceResolution: Hourly
  # Inverter status/run mode (health: inverter data available)
  InverterStatusEntity: sensor.solax_run_mode
  # daily energy import
  DailyImportEnergyEntity: sensor.solax_today_s_import_energy
  BatteryInputEnergyEntity: sensor.solax_battery_input_energy_today
  # daily energy export
  DailyExportEnergyEntity: sensor.solax_today_s_export_energy
  # *** current house load (W)
  CurrentHouseLoadEntity: sensor.solax_house_load
  # *** current PV production (W)
  CurrentPVPowerEntity: sensor.solax_pv_power_total
  # *** current Battery charge/discharge (W/-W)
  CurrentBatteryPowerEntity: sensor.solax_battery_power_charge
  InverterEfficiency: 0.95
  # total PV production today (kWh)
  TodayPVEnergyEntity: sensor.solax_today_s_solar_energy
  # current grid power usage import (-)/export (+)
  CurrentGridPowerEntity: sensor.solax_measured_power
  # Total PV production forecast for today (kWH)
  ForecastPVEnergyTodayEntities: 
    - sensor.energy_production_today_3
    - sensor.energy_production_today_4
  # Total PV production forecast for tomorrow (kWH)
  ForecastPVEnergyTomorrowEntities: 
    - sensor.energy_production_tomorrow_3
    - sensor.energy_production_tomorrow_4
  # *** Current SoC of battery (%)
  BatterySoCEntity: sensor.solax_battery_capacity
  # Max Capacity of battery (Wh) from sensor
  BatteryCapacityEntity: sensor.solax_bms_battery_capacity
  # Max Capacity of battery (Wh) direct value (if both are used, sensor has priority, but one of these is required)
  # BatteryCapacityValue: 11520
  # Max charge current of the battery (A), the hardware maximum. Not the Solax number entity: the
  # inverter sync (HA/InverterSync.yaml) sets that one to the commanded current, the import cap's limit
  # included (sensor.pv_control_mode, attribute battery_current_a).
  MaxBatteryChargeCurrrentValue: 30
  # Battery voltage while charging: W per A of the charge current (230 V without it)
  BatteryVoltageEntity: sensor.solax_battery_voltage_charge
  # Min SoC to keep (%) from sensor
  MinBatterySoCEntity: sensor.solax_battery_actual_min_soc
  # Min SoC to keep (%) direct value (if both are used, sensor has priority)
  #MinBatterySoCValue: 10
  # Energycost logging
  # DB location; relative: in this plugin's folder (next to this YAML)
  EnergyCostDBLocation: "energy_costs.db"
  # Grid import counters (kWh), in priority order: the first is used while it works (unavailable, or
  # frozen while a later one keeps counting = failed), the next ones only as fallback.
  TotalImportEnergyEntities:
    - sensor.utility_meter_import_energy   # e.g. the utility meter via wM-Bus (billing meter, 5 s, 10 Wh)
    - sensor.solax_grid_import_total                # inverter (0.1 kWh)
  TotalExportEnergyEntity: sensor.solax_grid_export_total
  # Import cap: the mean grid import (W) the guard steers each 15-min block to. This is a target, not a
  # hard limit: the guard uses the budget up to it, so a quarter can end a few W over. Keep it a little
  # under the line that really counts (the network's 10 kW) so that small overshoots stay below that.
  # The network power price (SNE-G-V, from 2027) counts the month's highest quarter-hour; above 10 kW it costs extra.
  # 0 = off. Battery grid charging is throttled first, then the EV paused, then warm-water heatings held.
  MaxGridImportW: 9900
  # A quarter above this (W) is a warning and degrades health; the cap above is the guard's aim with a margin
  # to the network's 10 kW, so a few W over it (one 10-Wh meter step = 40 W) aren't a problem.
  ImportCapWarnW: 9950
  # How long a requested change takes to show at the meter (automation delays, ramps), s
  ImportCapReactionSeconds: 90
  # Remote-controlled (VPP) grid charging is limited by the inverter, falling with the SoC (SolaX G4:
  # 5.07 kW at 21 %, 3.33 kW at 63 %; Manual Force Charge 7.45 kW). Default line W = At0 + Slope × SoC
  # until the curve is learned from VPP charges (sensor.pv_control_vpp_charge_limit).
  VppChargePowerAt0PctW: 5950
  VppChargePowerSlopeWPerPct: -41
  # HA's feedback whether the inverter runs sensor.pv_control_mode (HA/InverterHelpers.yaml)
  InverterSyncEntity: binary_sensor.pv_control_inverter_in_sync
  # The inverter's grid status: OffGrid (the house on the battery via EPS) for OffGridLoadPauseMinutes pauses the EV and
  # planned warm-water runs (a running heating finishes, the boost stays allowed) until it is OnGrid that long again;
  # health degraded while off-grid.
  GridStatusEntity: sensor.solax_grid_status
  OffGridStates: [OffGrid]
  OffGridLoadPauseMinutes: 5
  # Schedulable extra loads — each entry auto-creates HA entities for mode/target if not set here.
  # Mode values: Off, Optimal, Priority, PriorityPlus, Emergency
  # If Mode is omitted: HA select entity auto-created (select.pv_control_<slug>_mode)
  # If TargetLevel is omitted: HA number entity auto-created (number.pv_control_<slug>_target_level)
  SchedulableLoads:
    - Name: "EV Charger"
      Priority: 10
      # Defaults of the learned numbers (number.pv_control_<load>_energy_per_level / _charge_power: once created the
      # entity wins). kWh per % — 60 kWh battery / 100 % = 0.6; the charge power also bounds the metered energy check.
      EnergyPerLevelUnitKwhDefault: 0.6
      AvgPowerWDefault: 1800
      MinActivePowerW: 500
      LevelUnit: "%"
      TargetLevelMin: 20
      TargetLevelMax: 100
      TargetLevelStep: 5
      TargetLevelDefault: 80
      CurrentLevelEntity: sensor.ev_battery_level
      ActualPowerEntity: sensor.esp_ct8_carport
      ActualEnergyEntity: sensor.esp_ct8_daily_energy_carport
      # Reflects whether a chargeable car is at home (HA-side; already accounts for the
      # other-car-at-home override there) — used only to skip planning a charge window when
      # nothing is actually here to charge. The physical charger's own "ignore ChargeNow if
      # not Home" safety gate stays entirely in HA, unaffected by this.
      AvailabilityEntity: binary_sensor.ev_is_home
      # Subtract historical car-charging from the base load prediction (avoids double-counting).
      # Known DB column names: carcharge, warmwaterenergy, heatpumpenergy. Omit if no DB history.
      HistoryDbColumn: "carcharge"
      # Minimum window length (minutes) required to start a session.
      # Prevents start/stop oscillation when the window is marginal (e.g. real draw > AvgPowerWDefault).
      # Tune alongside AvgPowerWDefault — if real draw matches preset, 0 is fine.
      MinWindowMinutes: 15
      # Minimum off-time after a session stops before it may restart (stops are never delayed).
      MinOffMinutes: 15
      # Max minutes between two charge-window searches (the expensive part of a cycle). In between
      # it only replans on triggers: setting changes, new prices/quarter-hour, house battery SoC
      # or car SoC changes, charger start/stop, house load off its forecast.
      ReplanIntervalMinutes: 5
      # Mode and TargetLevel omitted — HA entities auto-created

  # Cost meters: every increase of a consumer's energy counter (kWh) is priced by the house's source mix of the
  # moment (PV 0, battery at its average cost per kWh delivered, grid at the import price) into
  # sensor.pv_control_<Slug>_total_cost (€). MaxPowerW: a counter step above 2 h of it is a glitch.
  # The heat pump's never-resetting counters: total = heating + warm water + standby.
  CostMeters:
    - Name: "Heat pump"
      Slug: heatpump
      EnergyEntity: sensor.wp_total_energy_consumption_noreset
      MaxPowerW: 4000
    - Name: "Heat pump heating"
      Slug: heatpump_heat
      EnergyEntity: sensor.heating_energy_consumption_noreset
      MaxPowerW: 4000
    - Name: "Heat pump warm water"
      Slug: heatpump_ww
      EnergyEntity: sensor.ww_energy_consumption_noreset
      MaxPowerW: 4000

  # Weather-aware load forecast (base load + heat pump heating by outside temperature).
  # Mode: Average (off) | Shadow (computed and published in sensor.pv_control_load_forecast,
  # PVControl keeps using the hour-of-day average) | Model (PVControl uses it; falls back to the
  # average without weather forecast or history).
  LoadForecast:
    Mode: Model
    # The heat pump heats the house only in these modes; otherwise only its standby is forecast.
    HeatPumpModeEntity: select.warmepumpe_modus
    HeatingModes:
      - "Warmwasser & Heizung"
    # Hourly forecast via weather.get_forecasts (Pirate Weather: 168 h).
    WeatherEntity: weather.pirateweather
    WeatherRefreshMinutes: 60

  # Warm-water tank planner: heats with one-time heatings at the cheapest times that keep the
  # comfort periods warm. Creates select.pv_control_warm_water_mode (Off / PlanOnly / Auto),
  # comfort and boost temperature numbers, button.pv_control_warm_water_boost, a time + enable
  # switch per comfort period, and sensor.pv_control_warm_water_plan. Set the heat pump's own
  # warm-water setpoint low (e.g. 20 °C) before switching to Auto — it stays as a safety net.
  WarmWater:
    Name: "Warm Water"
    TemperatureEntity: sensor.wp_warmwasser_temperatur
    # Used for learning the tank model, replanning and the house load; the control itself uses
    # OneTimeActiveEntity.
    HeatingActiveEntity: binary_sensor.wp_warmwasser_erzeugung_aktiv
    OneTimeActiveEntity: binary_sensor.wp_einmalige_ww_erzeugung_aktiv
    OneTimeSetpointEntity: number.wp_solltemperatur_warmwasser_einmalig
    OneTimeSwitchEntity: switch.wp_einmalige_warmwasser_erzeugung
    AutomaticSetpointEntity: number.wp_solltemperatur_warmwasser
    PowerEntity: sensor.wp_power_total
    # Subtract the historical warm-water energy from the house load prediction (the plan adds it back).
    HistoryDbColumn: "warmwaterenergy"
    MaxTemp: 57
    ComfortTempDefault: 42
    ComfortMarginK: 1
    BoostTempDefault: 45
    OneTimeHysteresisK: 5.5   # the heat pump starts a one-time heating only ≥ this far below its setpoint (measured: refused at 4.8 K, taken at 5.1 K)
    # Heat pump efficiency vs outside temperature (from LoadForecast.WeatherEntity): electrical
    # energy −3 % per K warmer (measured COP 3.9 → 6.3 over 15 K). 0 = off.
    EfficiencyChangePerK: 0.03
    ComfortPeriods:
      - Name: Morning
        DefaultTime: "06:30"
        DurationMinutes: 60
      - Name: Evening
        DefaultTime: "19:00"
        DurationMinutes: 120
  # PV forecast shadow (sensor.pv_control_pv_forecast, log in DBLocation): every source's forecast for tomorrow is
  # noted at SnapshotHour, scored against the measured day (DataLogger) and corrected by the median actual ÷ forecast
  # of the last WindowDays scored days, shifted by TemperatureSlopePerK per K the day is forecast warmer than those
  # days were (fog/inversion days are cold; 0.035 fitted on measured temperatures 2024-09…2025-08). Cautious value:
  # the source's band (GeoSphere's ensemble p10) corrected, else the CautiousPercentile of the ratios. Mode: Shadow
  # publishes only (the planners keep the raw Open-Meteo forecast); Steer: the planners use the first source's
  # corrected forecast — the next one in the list (corrected too) while it is older than SteerMaxAgeHours, hasn't
  # learned a correction or doesn't cover tomorrow; none usable: raw Open-Meteo. Sources (Type): OpenMeteoEntities
  # (ForecastPVEnergy…Entities above), GeoSphere (Austria only: the data hub's 1-km forecast and ensemble at zone.home;
  # KwhPerKwhM2: PV per global radiation; ValleyStation/HillStations: klima station ids whose measured day is logged —
  # sunshine on the hills above a fogged valley is the inversion signal). The first source is the sensor's state.
  PvForecast:
    Mode: Shadow
    DBLocation: "pv_forecast.db"
    SnapshotHour: 21   # GeoSphere's 15Z run is out by ~20:10
    WindowDays: 14
    MinScoredDays: 7
    TemperatureSlopePerK: 0.035
    CautiousPercentile: 0.25
    SteerMaxAgeHours: 6
    Sources:
      - Type: OpenMeteoEntities
        Name: OpenMeteo
      - Type: GeoSphere
        Name: GeoSphere
        RefreshMinutes: 180
        KwhPerKwhM2: 4.9   # 2026-11-01…09: daily PV ÷ INCA radiation
        # ValleyStation: 0          # optional: the nearest klima station in the valley (its id)
        # HillStations: [0, 0]      # optional: klima stations on the hills around (their ids)
  # DP shadow planner: plans the battery globally (dynamic program) next to the greedy plan every IntervalMinutes,
  # publishes the comparison (sensor.pv_control_dp_shadow) and logs it per quarter (DBLocation, in this plugin's
  # folder) — never steers. BandPenaltyPerPctQuarter: € per % below the preferred minimum per quarter.
  DpShadow:
    Enabled: true
    IntervalMinutes: 5
    BandPenaltyPerPctQuarter: 0.0005   # ≈ 1.7 ct per kWh of reserve and hour: bridges a peak to a clearly cheaper charge
    ChargeStartEur: 0.01   # € per grid charge started: one long charge instead of a block plus top-ups a fraction of a cent dearer; 0 = off
    DeviationEurPerKwh: 0.01   # € per kWh a hold, charge or feed-in first moves vs normal: deviating must save at least 1 ct/kWh; 0 = off
    DBLocation: "dp_shadow.db"
