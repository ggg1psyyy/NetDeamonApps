# PV Control – inverter command helpers (HA package: config/packages/pv_control_inverter.yaml).
#
# The reconciler (InverterSync.yaml) compares three states:
#   desired  – sensor.pv_control_mode (mode; attributes battery_power_w, bulk, seq)
#   applied  – the seq script.pv_control_apply_mode last wrote (input_number.pv_control_applied_seq)
#   actual   – what the inverter reports: VPP state, base work mode, manual mode
# The expected inverter state per command is defined only here (binary_sensor.pv_control_inverter_in_sync).

input_number:
  pv_control_applied_seq:
    name: PV Control applied command seq
    min: 0
    max: 1000000000
    step: 1
    mode: box
  pv_control_reapply_count:
    name: PV Control re-applies of the same command
    min: 0
    max: 1000
    step: 1
    mode: box

input_datetime:
  pv_control_applied_at:
    name: PV Control command applied at
    has_date: true
    has_time: true

input_boolean:
  pv_control_inverter_sync_blocked:
    name: PV Control inverter sync blocked (too many re-applies)

template:
  - binary_sensor:
      - name: PV Control inverter in sync
        unique_id: pv_control_inverter_in_sync
        # In sync: the applied version is the published one and the inverter is in the state that
        # command maps to (the same mapping as script.pv_control_apply_mode):
        #   bulk force_charge          → Manual Mode + Force Charge, VPP off, the command's charge current
        #   other charges/hold/discharge → base Self Use + VPP mode 8
        #   normal/feedin              → VPP off, base Self Use (Feedin Priority for feedin_priority)
        state: >-
          {% set mode = states('sensor.pv_control_mode') %}
          {% set seq = state_attr('sensor.pv_control_mode', 'seq') | int(-1) %}
          {% set bulk = state_attr('sensor.pv_control_mode', 'bulk') == true %}
          {% set manual = mode == 'force_charge' and bulk %}
          {% set vpp = not manual and mode in ['force_charge', 'force_charge_grid_only', 'grid_only', 'force_discharge'] %}
          {% set base = 'Feedin Priority' if mode == 'feedin_priority' else 'Self Use Mode' %}
          {% set vpp_state = states('sensor.solax_modbus_power_control') %}
          {% set use_mode = states('select.solax_charger_use_mode') %}
          {% set current_ok = (states('number.solax_battery_charge_max_current') | float(-1) - ([state_attr('sensor.pv_control_mode', 'battery_current_a') | float(30), state_attr('sensor.pv_control_mode', 'max_current_a') | float(30)] | min) | int) | abs < 0.5 %}
          {% set actual_ok = (manual and use_mode == 'Manual Mode' and is_state('select.solax_manual_mode_select', 'Force Charge') and vpp_state == 'Disabled' and current_ok)
                          or (vpp and use_mode != 'Manual Mode' and vpp_state == 'Individual Setting - Duration Mode')
                          or (not manual and not vpp and use_mode == base and vpp_state == 'Disabled') %}
          {{ seq == states('input_number.pv_control_applied_seq') | int(-2) and actual_ok }}
        attributes:
          blocked: "{{ is_state('input_boolean.pv_control_inverter_sync_blocked', 'on') }}"
