alias: PV Control - Mode Settings
description: >-
  Notifications for sensor.pv_control_mode. The inverter itself (work mode, manual mode, VPP) is set
  only by script.pv_control_apply_mode, applied and kept by "PV Control - Inverter Sync".
triggers:
  - trigger: state
    entity_id:
      - sensor.pv_control_mode
    not_to:
      - unknown
      - unavailable
    for:
      hours: 0
      minutes: 0
      seconds: 5
conditions: []
actions:
  - action: ntfy.publish
    metadata: {}
    data:
      title: PV Mode changed
      message: |-
        New mode: {{ states("sensor.pv_control_mode") }}
        Reason: {{ state_attr("sensor.pv_control_mode", "charge_Reason") or "-" }}
        {% if states("sensor.pv_control_mode") in ["force_charge", "force_charge_grid_only"] %}Limit: {{ state_attr("sensor.pv_control_mode", "import_cap_reason") or "-" }}
        {% endif %}Price: {{ states("sensor.pv_control_current_import_price_brutto") | float(0) | round(3) }} €/kWh
        Battery: {{ states("sensor.solax_battery_capacity") }}
        Current Load: {{ states("sensor.solax_house_load") }}
    target:
      entity_id: notify.power
mode: queued
