# Sample of TariffAdvisor.yaml — copy it to TariffAdvisor.yaml (not in git: the real config stays local and on HA, deploy.py copies it)
# and adapt it. A new or renamed key goes into both files.
NetDeamon.apps.TariffAdvisor.TariffAdvisorConfig:
  # false: the app does nothing at all (no entities, no timer).
  Enabled: true
  # PVControl's DP shadow DB, read only: its latest snapshot is the planning situation judged.
  SnapshotDb: "../PVControl/dp_shadow.db"
  # The other tariff is the result only if it saves at least this much over the plan's horizon (€).
  MinSavingEur: 0.30
  # An older snapshot isn't judged (PVControl not running): minutes.
  MaxSnapshotAgeMinutes: 30
